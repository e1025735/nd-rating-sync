name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # TinyGo's wasip1 target is assumed to have a 32-bit int (see CLAUDE.md):
      # running the tests as a 32-bit build catches size arithmetic that only
      # overflows there, which the 64-bit run and the fuzz seeds cannot.
      - name: Test (32-bit int)
        run: GOARCH=386 go test ./...

      - name: Vet
        run: go vet ./...
